<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>

    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <h2>Glenary's Restaurant</h2>

        <ul>
            <li><a href="#">Menu</a></li>
            <li><a href="#">Popular Dishes</a></li>
        </ul>
    </div>

    <!-- Heading -->
    <div class="heading">
        <h1>Our Special Menu</h1>
    </div>

    <!-- Menu Cards -->
    <div class="container">

        <!-- Pizza -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591" alt="Pizza">

            <div class="card-content">
                <h2>Pizza Supreme</h2>

                <p>
                    Pizza sauce, mozzarella, onion,
                    capsicum, mushroom and olives.
                </p>

                <p class="price">Price: ₹250</p>
            </div>
        </div>

        <!-- Paneer Tikka -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1603894584373-5ac82b2ae398" alt="Paneer Tikka">

            <div class="card-content">
                <h2>Paneer Tikka</h2>

                <p>
                    Paneer, yogurt, spices, onions,
                    bell peppers and mushrooms.
                </p>

                <p class="price">Price: ₹200</p>
            </div>
        </div>

    </div>

    <!-- Video Section -->
    <div class="video-section">

        <h1>Popular Dish Video</h1>

        <iframe 
            src="https://www.youtube.com/embed/sv3TXMSv6Lw"
            title="YouTube video"
            allowfullscreen>
        </iframe>

    </div>

</body>
</html>
